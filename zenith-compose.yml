x-zenith:
  catalog:
    name: Spendwise
    description: Personal budgeting with transaction tracking, monthly reports, and model-based investment recommendations.
    authors: [jesshush]
    source: https://github.com/jesshush/Spendwise
    license: UNLICENSED
    tags: [budgeting, personal-finance, finance]
  expose:
    - service: web
      port: 3000
      web: true

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendwise
      POSTGRES_USER: spendwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendwise-local}
    volumes:
      - spendwise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise -d spendwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://spendwise:${POSTGRES_PASSWORD:-spendwise-local}@database:5432/spendwise
      PREDICTOR_URL: http://127.0.0.1:5000
      PREDICTOR_AUTOSTART: "true"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  spendwise-postgres:
  