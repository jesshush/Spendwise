<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spendwise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Spendwise</h1>

    <div id="auth">
      <div class="tabs">
        <button id="tab-login" class="active">Log in</button>
        <button id="tab-signup">Sign up</button>
      </div>
      <form id="form">
        <label id="name-row" hidden>First name <input id="name"></label>
        <label>Email <input id="email" type="email" required></label>
        <label>Password <input id="password" type="password" required minlength="8"></label>
        <p id="error"></p>
        <button type="submit" id="submit">Log in</button>
      </form>
    </div>

    <div id="home" hidden>
      <h2 id="hello"></h2>
      <button id="logout">Log out</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
